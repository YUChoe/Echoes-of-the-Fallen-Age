# MUD 서버만 컨테이너로 돌린다.
#
# 게이트웨이는 호스트에서 Node 로 띄우고 랜딩은 nginx 가 정적으로 준다. 프로덕션(Oracle Linux 7)의
# 파이썬이 3.9 라 서버를 맨몸으로 올릴 수 없어서 나온 구성이다. `aiohttp` 가
# 3.10 이상을 요구하고 코드가 PEP 604 유니온을 쓴다.
#
# podman-compose 로도 그대로 돈다. `docker` 를 `podman` 으로 바꿔 읽으면 된다.
#
#   podman-compose up -d --build
#   podman-compose logs -f
#
# 두 포트를 127.0.0.1 에 묶는다. 플레이어는 게이트웨이를 통해서만 들어오고,
# 게이트웨이는 같은 호스트에서 돈다. 어드민 포트는 특히 밖으로 열지 않는다.

# `version` 키가 없으면 옛 docker-compose 가 파일을 v1 레거시 형식으로 읽는다.
# 그러면 최상위 키를 서비스 이름으로 해석해 파싱 자체가 실패한다. 새 Compose 는
# 이 키를 무시하고 경고만 낸다
version: "2.1"

services:
  mud:
    build:
      context: .
      # 셸에서 export 해서 넘긴다. `${VAR:-기본값}` 은 docker-compose 1.11
      # 이상에서만 통해 프로덕션의 옛 바이너리가 파싱하지 못한다.
      # 비우면 이미지 라벨과 welcome 의 server_version 이 빈 값이 된다
      args:
        VERSION: ${VERSION}
        VCS_REF: ${VCS_REF}
        BUILD_DATE: ${BUILD_DATE}
    container_name: mud-engine
    restart: unless-stopped

    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4001:4001"

    volumes:
      # 세계 데이터. SQLite 파일이 여기 있다
      - ./data:/app/data
      - ./logs:/app/logs
      # Lua 대사와 아이템·몬스터 템플릿. 서버가 실행 중에 디스크에서 읽으므로
      # 여기를 고치면 재시작 없이 반영된다
      - ./configs:/app/configs

    environment:
      # 컨테이너 안에서는 두 포트를 모두 0.0.0.0 에 연다. 밖으로 나가는 통제는
      # 위의 포트 발행이 맡는다
      TELNET_HOST: 0.0.0.0
      TELNET_PORT: 4000
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 4001
      LOG_LEVEL: ${LOG_LEVEL}

    # 종료는 SIGTERM 이다. WAL 체크포인트와 세션 종료 알림이 끝날 시간을 준다
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
