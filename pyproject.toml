[tool.ruff]
line-length = 140

[tool.ruff.lint]
# 룰셋을 명시적으로 고정한다.
# ruff 0.16.2부터 기본 선택 범위가 넓어져 UP/BLE/I/DTZ/G/RUF/SIM/TRY 등이 포함되고
# 1,373건이 보고된다. 코드 결함이 아니라 툴 버전 차이이므로, 페이즈2 전환 작업의
# diff가 린트 정리와 섞이지 않도록 전통적 기본값으로 범위를 고정한다.
# 확대된 룰셋 정리는 별도 작업으로 분리한다.
select = ["E4", "E7", "E9", "F"]

ignore = [
    "F401",  # Imported but unused
    "F541",  # f-string without any placeholders
    "F841",  # Local variable assigned to but never used
    "E701",  # Multiple statements on one line (colon)
    "E712",  # Comparison to True/False
    "E722",  # Do not use bare `except`
]
